services:
  thinvol:
    build: .
    image: thinvol:local
    ports:
      - "${THINVOL_PORT:-8000}:8000"
    environment:
      # Physical 4 KiB blocks available to the whole pool.  Shared blocks
      # (after a clone) occupy exactly one block regardless of reference count.
      POOL_BLOCKS: "${POOL_BLOCKS:-64}"
      DB_PATH: /data/volumes.sqlite3
      # Each worker holds its own SQLite connections; writers are serialized
      # by BEGIN IMMEDIATE, so this is about HTTP concurrency, not safety.
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-4}"
      SQLITE_BUSY_TIMEOUT_MS: "${SQLITE_BUSY_TIMEOUT_MS:-30000}"
    volumes:
      - thinvol-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen(
          'http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  thinvol-data:
